<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexora - Qualificação</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
            /* Deep Dark mode background */
            color: #FFFFFF;
        }

        /* Glassmorphism utility */
        .glass {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .glass-gradient-border {
            position: relative;
        }

        .glass-gradient-border::before {
            content: "";
            position: absolute;
            inset: -1px;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(to bottom right, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.01));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        /* Animations */
        .step-enter {
            animation: fadeInSlideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .step-exit {
            animation: fadeOutSlideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInSlideUp {
            from {
                opacity: 0;
                transform: translateY(15px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes fadeOutSlideUp {
            from {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

            to {
                opacity: 0;
                transform: translateY(-15px) scale(0.98);
            }
        }

        /* Custom Radio Button Styles */
        .option-card {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .option-card:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .option-card.selected {
            background: rgba(8, 145, 178, 0.15);
            /* Cyan accent */
            border-color: #06b6d4;
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.15);
        }
    </style>
    <!-- Meta Pixel Code -->
    <script>
        !function(f,b,e,v,n,t,s)
        {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};
        if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
        n.queue=[];t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t,s)}(window, document,'script',
        'https://connect.facebook.net/en_US/fbevents.js');
        fbq('init', '1518701493022426');
        fbq('track', 'PageView');
    </script>
    <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=1518701493022426&ev=PageView&noscript=1"
    /></noscript>
    <!-- End Meta Pixel Code -->
</head>

<body class="min-h-screen flex items-center justify-center p-4 relative z-0">

    <!-- Decorative background elements -->
    <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute inset-0 opacity-[0.03]"
            style="background-image: url('data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.65%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22/%3E%3C/svg%3E');">
        </div>
        <div class="absolute top-[-20%] left-[-10%] w-[50%] h-[50%] rounded-full bg-blue-900/10 blur-[120px]"></div>
        <div class="absolute bottom-[-20%] right-[-10%] w-[50%] h-[50%] rounded-full bg-cyan-900/10 blur-[120px]"></div>
    </div>

    <main class="w-full max-w-xl">
        <!-- Form Container -->
        <div class="glass glass-gradient-border rounded-[2rem] p-6 sm:p-10 relative overflow-hidden shadow-2xl">

            <!-- Logo -->
            <div class="flex justify-center mb-6 mt-2">
                <img src="./Nexora.png" alt="Nexora Tecnologia" class="h-8 sm:h-10 object-contain drop-shadow-lg">
            </div>

            <!-- Quiz Intro -->
            <div id="quiz-intro" class="text-center mb-8">
                <h1 class="text-xl sm:text-2xl font-bold text-white tracking-tight mb-2">
                    Vamos entender o seu negócio.
                </h1>
                <p class="text-gray-400 text-xs sm:text-sm leading-relaxed max-w-md mx-auto">
                    Responda a quatro perguntas para descobrirmos como podemos ajudar você a conquistar mais clientes.
                </p>
            </div>

            <!-- Progress Bar -->
            <div id="progress-container" class="w-full bg-white/5 rounded-full h-1.5 mb-6 hidden overflow-hidden">
                <div id="progress-bar"
                    class="bg-gradient-to-r from-blue-500 to-cyan-400 h-full rounded-full transition-all duration-700 ease-out shadow-[0_0_10px_rgba(6,182,212,0.5)]"
                    style="width: 0%"></div>
            </div>

            <!-- Header Info (Back button & Step counter) -->
            <div id="form-header"></div>

            <!-- Steps Container -->
            <div id="form-steps-container" class="relative min-h-[280px] flex items-center">
                <!-- Content injected via JS -->
            </div>

        </div>

        <!-- Footer info -->
        <div class="text-center mt-6 text-gray-500 text-xs flex justify-center items-center gap-1.5 opacity-80 px-4">
            <svg class="w-3.5 h-3.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z">
                </path>
            </svg>
            <span>Seus dados serão utilizados para avaliar seu perfil e entrar em contato, conforme nossa política de privacidade.</span>
        </div>
    </main>

    <script>
        const questions = [
            {
                id: 'tipo_negocio',
                question: '1. Qual é o seu tipo de negócio?',
                options: [
                    { label: 'Comércio ou loja física', value: 'Comércio ou loja física' },
                    { label: 'Loja virtual (e-commerce)', value: 'Loja virtual (e-commerce)' },
                    { label: 'Empresa prestadora de serviços', value: 'Empresa prestadora de serviços' },
                    { label: 'Profissional liberal ou autônomo', value: 'Profissional liberal ou autônomo' },
                    { label: 'Outro', value: 'Outro' }
                ]
            },
            {
                id: 'experiencia_anuncios',
                question: '2. Você já investiu em anúncios para conseguir clientes?',
                options: [
                    { label: 'Sim, mas não tive bons resultados.', value: 'Sim, mas não tive bons resultados.' },
                    { label: 'Sim, tenho resultados, mas quero melhorar.', value: 'Sim, tenho resultados, mas quero melhorar.' },
                    { label: 'Sim, mas parei de anunciar.', value: 'Sim, mas parei de anunciar.' },
                    { label: 'Ainda não, quero começar.', value: 'Ainda não, quero começar.' },
                    { label: 'Já anuncio por conta própria.', value: 'Já anuncio por conta própria.' }
                ]
            },
            {
                id: 'investimento_mensal',
                question: '3. Quanto sua empresa está disposta a investir para atrair novos clientes?',
                subtitle: 'Considere o valor total disponível para gestão e investimento em anúncios.',
                options: [
                    { label: 'Menos de R$ 1.000', value: 'Menos de R$ 1.000', tier: 'low' },
                    { label: 'R$ 1.000 a R$ 1.999', value: 'R$ 1.000 a R$ 1.999', tier: 'mid' },
                    { label: 'R$ 2.000 a R$ 3.000', value: 'R$ 2.000 a R$ 3.000', tier: 'qualified' },
                    { label: 'Mais de R$ 3.000', value: 'Mais de R$ 3.000', tier: 'qualified' }
                ]
            },
            {
                id: 'faturamento_mensal',
                question: '4. Qual é o faturamento mensal aproximado do seu negócio?',
                options: [
                    { label: 'Ainda não faturo.', value: 'Ainda não faturo.' },
                    { label: 'Até R$ 5 mil.', value: 'Até R$ 5 mil.' },
                    { label: 'R$ 5 mil a R$ 15 mil.', value: 'R$ 5 mil a R$ 15 mil.' },
                    { label: 'R$ 15 mil a R$ 50 mil.', value: 'R$ 15 mil a R$ 50 mil.' },
                    { label: 'R$ 50 mil a R$ 100 mil.', value: 'R$ 50 mil a R$ 100 mil.' },
                    { label: 'Mais de R$ 100 mil.', value: 'Mais de R$ 100 mil.' }
                ]
            }
        ];

        let currentStep = 0;
        const answers = {};
        let hasTrackedFormStart = false;
        let hasTrackedQuizCompleted = false;

        function generateId() {
            if (typeof crypto !== 'undefined' && crypto.randomUUID) {
                return crypto.randomUUID();
            }
            return 'nx-' + Date.now() + '-' + Math.random().toString(36).substring(2, 10);
        }

        function getCookie(name) {
            const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
            return match ? decodeURIComponent(match[2]) : null;
        }

        function captureAttribution() {
            const params = new URLSearchParams(window.location.search);
            const fbclid = params.get('fbclid') || null;
            const fbp = getCookie('_fbp');
            let fbc = getCookie('_fbc');
            if (!fbc && fbclid) {
                fbc = `fb.1.${Date.now()}.${fbclid}`;
            }

            let leadId = null;
            try {
                leadId = sessionStorage.getItem('nexora_lead_id');
                if (!leadId) {
                    leadId = generateId();
                    sessionStorage.setItem('nexora_lead_id', leadId);
                }
            } catch (e) {
                leadId = generateId();
            }

            return {
                lead_id: leadId,
                utm_source: params.get('utm_source') || null,
                utm_medium: params.get('utm_medium') || null,
                utm_campaign: params.get('utm_campaign') || null,
                utm_content: params.get('utm_content') || null,
                utm_term: params.get('utm_term') || null,
                fbclid: fbclid,
                fbp: fbp,
                fbc: fbc,
                event_source_url: window.location.href,
                user_agent: navigator.userAgent
            };
        }

        const attributionData = captureAttribution();

        function trackPixelCustomEvent(eventName, params = {}) {
            const eventId = `${attributionData.lead_id}_${eventName}`;
            if (typeof fbq !== 'undefined') {
                fbq('trackCustom', eventName, params, { eventID: eventId });
            }
            return eventId;
        }

        try {
            const savedAnswers = sessionStorage.getItem('nexora_quiz_answers');
            if (savedAnswers) {
                Object.assign(answers, JSON.parse(savedAnswers));
            }
        } catch (e) {
            // Ignore storage errors in restricted environments
        }

        // Integração direta em código puro com a sua planilha Google Sheets:
        // https://docs.google.com/spreadsheets/d/11Bh-ju8Ma06N-gPWCaiyWifg17ceiRQFBzloguBn4-w/edit
        const SPREADSHEET_ID = '11Bh-ju8Ma06N-gPWCaiyWifg17ceiRQFBzloguBn4-w';
        // Cole abaixo a URL do App da Web gerado no Google Apps Script da sua planilha (arquivo google-sheets-backend.gs):
        const GOOGLE_SHEETS_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbzaH6G-TfHGDTFA8RCziauxLVxzJBuoh9g1HmyCZ0VJZpcFIAD1-bXWexKaR-2DC_oefQ/exec';

        const totalSteps = questions.length + 1; // 4 perguntas + 1 etapa de contato
        const container = document.getElementById('form-steps-container');
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');
        const headerContainer = document.getElementById('form-header');
        const quizIntro = document.getElementById('quiz-intro');

        function saveState() {
            try {
                sessionStorage.setItem('nexora_quiz_answers', JSON.stringify(answers));
            } catch (e) {
                // Ignore storage errors
            }
        }

        function sendWebhookPayload(eventType, extraData = {}) {
            const payload = {
                spreadsheet_id: SPREADSHEET_ID,
                event_type: eventType,
                event_id: `${attributionData.lead_id}_${eventType}`,
                timestamp: new Date().toISOString(),
                origin: attributionData.utm_source || (attributionData.fbclid ? 'Meta Ads' : 'Direto / Orgânico'),
                contact: {
                    name: answers['nome'] || null,
                    whatsapp: answers['whatsapp'] || null,
                    whatsapp_e164: answers['whatsapp_e164'] || null,
                    email: answers['email'] || null
                },
                qualification: {
                    status: evaluateProfile(),
                    tipo_negocio: answers['tipo_negocio'] || null,
                    experiencia_anuncios: answers['experiencia_anuncios'] || null,
                    investimento_mensal: answers['investimento_mensal'] || null,
                    faturamento_mensal: answers['faturamento_mensal'] || null
                },
                attribution: attributionData,
                ...extraData
            };

            // Salva o último payload localmente para inspeção/recuperação
            try {
                sessionStorage.setItem('nexora_last_payload', JSON.stringify(payload));
            } catch (e) {}

            if (GOOGLE_SHEETS_WEBAPP_URL) {
                // Usa text/plain para evitar bloqueio de preflight CORS no Google Apps Script
                fetch(GOOGLE_SHEETS_WEBAPP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload),
                    keepalive: true
                }).catch(() => {});
            }
            return payload;
        }

        function renderStep(stepIndex) {
            // Unbind previous keyboard listeners
            document.onkeydown = null;

            if (stepIndex < totalSteps) {
                if (quizIntro) quizIntro.classList.remove('hidden');
                progressContainer.classList.remove('hidden');
                const progress = ((stepIndex + 1) / totalSteps) * 100;
                progressBar.style.width = `${progress}%`;

                // Render Header elements
                headerContainer.innerHTML = `
                    <div class="flex justify-between items-center mb-6 text-sm font-medium step-enter">
                        ${stepIndex > 0 ?
                        `<button onclick="goBack()" class="text-gray-400 hover:text-white transition flex items-center gap-1.5 group px-2 py-1 -ml-2 rounded-lg hover:bg-white/5 focus:outline-none focus:ring-2 focus:ring-white/20">
                                <svg class="w-4 h-4 transform group-hover:-translate-x-1 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg> Voltar
                            </button>`
                        : '<div></div>'}
                        <span class="text-cyan-300 text-xs font-semibold uppercase tracking-wider bg-cyan-900/30 px-3 py-1 rounded-full border border-cyan-500/20 shadow-[0_0_10px_rgba(6,182,212,0.1)]">Passo ${stepIndex + 1} de ${totalSteps}</span>
                    </div>
                `;
            } else {
                if (quizIntro) quizIntro.classList.add('hidden');
                progressContainer.classList.add('hidden');
                headerContainer.innerHTML = `
                    <div class="flex justify-start items-center mb-4 text-sm font-medium step-enter">
                        <button onclick="goBack()" class="text-gray-400 hover:text-white transition flex items-center gap-1.5 group px-2 py-1 -ml-2 rounded-lg hover:bg-white/5 focus:outline-none focus:ring-2 focus:ring-white/20">
                            <svg class="w-4 h-4 transform group-hover:-translate-x-1 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg> Voltar e revisar dados
                        </button>
                    </div>
                `;
            }

            const currentElement = container.firstElementChild;
            if (currentElement) {
                currentElement.classList.remove('step-enter');
                currentElement.classList.add('step-exit');

                setTimeout(() => {
                    container.innerHTML = '';
                    buildStepHTML(stepIndex);
                }, 300);
            } else {
                buildStepHTML(stepIndex);
            }
        }

        function goBack() {
            if (currentStep > 0) {
                currentStep--;
                renderStep(currentStep);
            }
        }

        function evaluateProfile() {
            const investQuestion = questions.find(q => q.id === 'investimento_mensal');
            const selectedInvest = investQuestion?.options.find(o => o.value === answers['investimento_mensal']);
            const tier = selectedInvest ? selectedInvest.tier : 'low';

            // A partir de R$ 2 mil: encaminhar diretamente para consultoria no WhatsApp
            if (tier === 'qualified') {
                return 'qualified';
            }

            // Casos especiais para avaliação manual / orientação:
            // Profissionais liberais ou empresas que já faturam e têm entre R$ 1.000 e R$ 1.999
            const isHighPotentialSpecialCase =
                tier === 'mid' &&
                (answers['tipo_negocio'] === 'Profissional liberal ou autônomo' ||
                    answers['faturamento_mensal'] !== 'Ainda não faturo.');

            if (isHighPotentialSpecialCase) {
                return 'special_case';
            }

            return 'not_qualified';
        }

        function buildStepHTML(stepIndex) {
            const stepDiv = document.createElement('div');
            stepDiv.className = 'step-enter w-full';

            if (stepIndex < questions.length) {
                const q = questions[stepIndex];

                const title = document.createElement('h2');
                title.className = `text-xl sm:text-2xl font-semibold ${q.subtitle ? 'mb-2' : 'mb-6'} text-white leading-tight tracking-tight`;
                title.innerText = q.question;
                stepDiv.appendChild(title);

                if (q.subtitle) {
                    const subtitle = document.createElement('p');
                    subtitle.className = 'text-gray-400 text-xs sm:text-sm mb-6 leading-relaxed';
                    subtitle.innerText = q.subtitle;
                    stepDiv.appendChild(subtitle);
                }

                const optionsContainer = document.createElement('div');
                optionsContainer.className = 'flex flex-col gap-3';

                q.options.forEach((opt, idx) => {
                    const btn = document.createElement('button');
                    const isSelected = answers[q.id] === opt.value;

                    // Support keyboard tab navigation
                    btn.tabIndex = 0;

                    btn.className = `option-card w-full text-left p-4 sm:p-5 rounded-xl border ${isSelected ? 'border-[#06b6d4] bg-[rgba(8,145,178,0.15)] shadow-[0_0_20px_rgba(6,182,212,0.15)] selected' : 'border-white/5 bg-white/5'} text-gray-200 font-medium focus:outline-none focus:ring-2 focus:ring-cyan-500/50 flex items-center justify-between group`;

                    btn.innerHTML = `
                        <div class="flex items-center gap-3.5">
                            <div class="hidden sm:flex w-6 h-6 rounded bg-black/40 border ${isSelected ? 'border-cyan-500/50 text-cyan-400' : 'border-white/10 text-gray-400 group-hover:bg-white/10'} items-center justify-center text-xs transition font-mono shadow-inner">${idx + 1}</div>
                            <span class="text-sm sm:text-base leading-snug">${opt.label}</span>
                        </div>
                        <div class="flex-shrink-0 ml-4 w-5 h-5 rounded-full border ${isSelected ? 'border-gray-400' : 'border-gray-600'} group-hover:border-gray-400 flex items-center justify-center transition-colors">
                            <div class="w-2.5 h-2.5 rounded-full bg-cyan-400 ${isSelected ? 'opacity-100 scale-100' : 'opacity-0 scale-50'} transition-all duration-300"></div>
                        </div>
                    `;

                    btn.onclick = () => handleSelectOption(q.id, opt, btn);
                    optionsContainer.appendChild(btn);
                });

                stepDiv.appendChild(optionsContainer);

                // Add text helper for keyboard navigation on Desktop
                const hint = document.createElement('div');
                hint.className = 'hidden sm:block text-center mt-6 text-gray-500 text-xs';
                hint.innerHTML = `Dica: Use os números <kbd class="font-mono bg-white/10 px-1.5 py-0.5 rounded text-gray-400">1</kbd> a <kbd class="font-mono bg-white/10 px-1.5 py-0.5 rounded text-gray-400">${q.options.length}</kbd> para selecionar rapidamente.`;
                stepDiv.appendChild(hint);

                // Keyboard events
                document.onkeydown = (e) => {
                    const num = parseInt(e.key);
                    if (num > 0 && num <= q.options.length) {
                        const opt = q.options[num - 1];
                        const btn = optionsContainer.children[num - 1];
                        handleSelectOption(q.id, opt, btn);
                    }
                };

                container.appendChild(stepDiv);
            } else if (stepIndex === questions.length) {
                buildContactStepHTML(stepDiv);
                container.appendChild(stepDiv);
            } else {
                buildFinalResultHTML();
            }
        }

        function formatPhoneBR(value) {
            const digits = value.replace(/\D/g, '').slice(0, 11);
            if (digits.length === 0) return '';
            if (digits.length <= 2) return `(${digits}`;
            if (digits.length <= 6) return `(${digits.slice(0, 2)}) ${digits.slice(2)}`;
            if (digits.length <= 10) return `(${digits.slice(0, 2)}) ${digits.slice(2, 6)}-${digits.slice(6)}`;
            return `(${digits.slice(0, 2)}) ${digits.slice(2, 7)}-${digits.slice(7)}`;
        }

        function buildContactStepHTML(stepDiv) {
            stepDiv.innerHTML = `
                <div>
                    <h2 class="text-xl sm:text-2xl font-semibold mb-2 text-white leading-tight tracking-tight">
                        Como podemos entrar em contato com você?
                    </h2>
                    <p class="text-gray-400 text-xs sm:text-sm mb-6 leading-relaxed">
                        Informe seus dados para concluirmos a avaliação e prepararmos seu diagnóstico comercial.
                    </p>
                    <form id="contact-form" class="flex flex-col gap-4" novalidate>
                        <div>
                            <label for="lead-name" class="block text-xs font-medium text-gray-300 mb-1.5">Nome *</label>
                            <input
                                type="text"
                                id="lead-name"
                                required
                                placeholder="Seu nome ou nome do responsável"
                                value="${answers['nome'] || ''}"
                                class="w-full px-4 py-3.5 rounded-xl bg-white/5 border border-white/10 text-white placeholder-gray-500 text-sm sm:text-base focus:outline-none focus:border-cyan-400 focus:ring-2 focus:ring-cyan-500/30 transition"
                            />
                        </div>
                        <div>
                            <label for="lead-whatsapp" class="block text-xs font-medium text-gray-300 mb-1.5">WhatsApp (com DDD) *</label>
                            <input
                                type="tel"
                                id="lead-whatsapp"
                                required
                                placeholder="(11) 99999-9999"
                                value="${answers['whatsapp'] || ''}"
                                class="w-full px-4 py-3.5 rounded-xl bg-white/5 border border-white/10 text-white placeholder-gray-500 text-sm sm:text-base focus:outline-none focus:border-cyan-400 focus:ring-2 focus:ring-cyan-500/30 transition"
                            />
                        </div>
                        <div>
                            <label for="lead-email" class="block text-xs font-medium text-gray-300 mb-1.5">E-mail <span class="text-gray-500 font-normal">(opcional)</span></label>
                            <input
                                type="email"
                                id="lead-email"
                                placeholder="seu@email.com.br"
                                value="${answers['email'] || ''}"
                                class="w-full px-4 py-3.5 rounded-xl bg-white/5 border border-white/10 text-white placeholder-gray-500 text-sm sm:text-base focus:outline-none focus:border-cyan-400 focus:ring-2 focus:ring-cyan-500/30 transition"
                            />
                        </div>
                        <p id="contact-error" class="text-red-400 text-xs hidden"></p>
                        <button
                            type="submit"
                            class="mt-2 inline-flex items-center justify-center w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-semibold py-4 px-8 rounded-xl transition-all transform hover:-translate-y-0.5 shadow-[0_10px_20px_rgba(6,182,212,0.2)] focus:ring-4 focus:ring-cyan-500/30"
                        >
                            <span>Ver resultado da avaliação</span>
                            <svg class="w-5 h-5 ml-2 -mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                        </button>
                    </form>
                </div>
            `;

            const form = stepDiv.querySelector('#contact-form');
            const nameInput = stepDiv.querySelector('#lead-name');
            const whatsappInput = stepDiv.querySelector('#lead-whatsapp');
            const emailInput = stepDiv.querySelector('#lead-email');
            const errorEl = stepDiv.querySelector('#contact-error');

            whatsappInput.addEventListener('input', (e) => {
                e.target.value = formatPhoneBR(e.target.value);
            });

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const nameVal = nameInput.value.trim();
                const whatsappVal = whatsappInput.value.trim();
                const whatsappDigits = whatsappVal.replace(/\D/g, '');
                const emailVal = emailInput.value.trim();

                if (nameVal.length < 2) {
                    errorEl.textContent = 'Por favor, informe seu nome para continuarmos.';
                    errorEl.classList.remove('hidden');
                    nameInput.focus();
                    return;
                }

                if (whatsappDigits.length < 10) {
                    errorEl.textContent = 'Por favor, informe um número de WhatsApp válido com DDD.';
                    errorEl.classList.remove('hidden');
                    whatsappInput.focus();
                    return;
                }

                errorEl.classList.add('hidden');
                answers['nome'] = nameVal;
                answers['whatsapp'] = whatsappVal;
                answers['whatsapp_e164'] = `+55${whatsappDigits}`;
                answers['email'] = emailVal || '';
                saveState();

                currentStep++;
                renderStep(currentStep);
            });
        }

        function buildFinalResultHTML() {
            const stepDiv = document.createElement('div');
            stepDiv.className = 'step-enter w-full';

            const status = evaluateProfile();
            if (!hasTrackedQuizCompleted) {
                hasTrackedQuizCompleted = true;
                trackPixelCustomEvent('QuizCompleted', {
                    content_name: 'Diagnostico Nexora',
                    qualified: status === 'qualified'
                });
                sendWebhookPayload('QuizCompleted');
            }

            const summaryLines = [
                `Nome: ${answers['nome'] || '-'}`,
                `Tipo de negócio: ${answers['tipo_negocio']}`,
                `Experiência com anúncios: ${answers['experiencia_anuncios']}`,
                `Investimento mensal disponível: ${answers['investimento_mensal']}`,
                `Faturamento mensal: ${answers['faturamento_mensal']}`
            ].join('\n');

            if (status === 'qualified') {
                const waText = encodeURIComponent(`Olá, Nexora! Me chamo ${answers['nome']} e respondi o diagnóstico no site. Gostaria de avaliar uma estratégia de aquisição de clientes para o meu negócio.\n\n${summaryLines}`);
                const waLink = `https://wa.me/559420180580?text=${waText}`;

                stepDiv.innerHTML = `
                    <div class="text-center py-4">
                        <div class="inline-flex items-center gap-2 text-cyan-300 text-xs font-semibold uppercase tracking-wider bg-cyan-900/30 px-3.5 py-1.5 rounded-full border border-cyan-500/20 shadow-[0_0_10px_rgba(6,182,212,0.1)] mb-5">
                            <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
                            Perfil compatível
                        </div>
                        <h2 class="text-2xl sm:text-3xl font-bold mb-4 text-white tracking-tight">Podemos dar o próximo passo.</h2>
                        <p class="text-gray-300 mb-3 text-sm sm:text-base leading-relaxed">
                            Suas respostas indicam que vale a pena avaliar uma estratégia de aquisição de clientes para o seu negócio.
                        </p>
                        <p class="text-gray-400 mb-8 text-sm sm:text-base leading-relaxed">
                            Vamos entender seu cenário, identificar oportunidades e verificar se Meta Ads ou Google Ads faz mais sentido para sua operação.
                        </p>
                        <a href="${waLink}" target="_blank" rel="noopener noreferrer" onclick="trackWhatsAppClick('qualified')" class="inline-flex items-center justify-center w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-semibold py-4 px-8 rounded-xl transition-all transform hover:-translate-y-0.5 shadow-[0_10px_20px_rgba(6,182,212,0.2)] focus:ring-4 focus:ring-cyan-500/30">
                            <span>Conversar com um especialista</span>
                            <svg class="w-5 h-5 ml-2 -mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                        </a>
                        <p class="text-gray-500 text-xs mt-3">
                            Sem compromisso. Uma conversa para avaliar seu negócio.
                        </p>
                    </div>
                `;
            } else {
                const manualWaText = encodeURIComponent(`Olá, Nexora! Me chamo ${answers['nome']} e preenchi o formulário no site. Gostaria de receber orientações ou verificar a possibilidade de uma avaliação manual para o meu cenário.\n\n${summaryLines}`);
                const manualWaLink = `https://wa.me/559420180580?text=${manualWaText}`;

                stepDiv.innerHTML = `
                    <div class="text-center py-6">
                        <div class="w-16 h-16 bg-white/5 rounded-full flex items-center justify-center mx-auto mb-6 border border-white/10">
                            <svg class="w-8 h-8 text-cyan-400/80" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        </div>
                        <h2 class="text-2xl font-semibold mb-4 text-white tracking-tight">Talvez ainda não seja o momento ideal.</h2>
                        <p class="text-gray-300 text-sm sm:text-base leading-relaxed max-w-md mx-auto mb-3">
                            Neste momento, nosso modelo de gestão exige um investimento mínimo para que possamos estruturar e acompanhar as campanhas adequadamente.
                        </p>
                        <p class="text-gray-400 text-sm sm:text-base leading-relaxed max-w-md mx-auto mb-8">
                            Isso não significa que seu negócio não tenha potencial. Continue acompanhando a Nexora e prepare sua operação para investir em aquisição de clientes quando chegar a hora.
                        </p>
                        <div class="flex flex-col items-center gap-4">
                            <a href="https://nexoratecnologia.com/" target="_blank" rel="noopener noreferrer" class="inline-flex items-center justify-center px-6 py-3 rounded-xl bg-white/10 hover:bg-white/15 border border-white/10 text-sm font-medium text-white transition-colors">
                                Conhecer a Nexora <span class="ml-1.5">→</span>
                            </a>
                            ${status === 'special_case' ? `
                                <div class="mt-4 pt-5 border-t border-white/10 w-full max-w-md">
                                    <p class="text-xs text-gray-400 mb-3">
                                        Seu negócio já possui operação em andamento ou ticket mais alto? Solicite uma avaliação manual ou receba orientações para o seu momento:
                                    </p>
                                    <a href="${manualWaLink}" target="_blank" rel="noopener noreferrer" onclick="trackWhatsAppClick('special_case')" class="inline-flex items-center text-xs sm:text-sm font-medium text-cyan-400 hover:text-cyan-300 transition-colors">
                                        Solicitar avaliação manual / receber orientações →
                                    </a>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            }
            container.appendChild(stepDiv);
        }

        function trackWhatsAppClick(flowType) {
            trackPixelCustomEvent('WhatsAppClick', {
                content_name: 'Diagnostico Nexora',
                flow_type: flowType
            });
            sendWebhookPayload('WhatsAppClick', { flow_type: flowType });
        }

        function handleSelectOption(questionId, option, btnElement) {
            // Unbind keyboard to prevent double clicks during animation
            document.onkeydown = null;

            // Dispara FormStart ao responder a primeira pergunta
            if (currentStep === 0 && !hasTrackedFormStart) {
                hasTrackedFormStart = true;
                trackPixelCustomEvent('FormStart', {
                    content_name: 'Diagnostico Nexora'
                });
            }

            // Visual feedback
            const allBtns = btnElement.parentElement.children;
            for (let btn of allBtns) {
                btn.classList.remove('selected', 'border-[#06b6d4]', 'bg-[rgba(8,145,178,0.15)]');
                btn.classList.add('border-white/5', 'bg-white/5');
                const radioCircleOuter = btn.querySelector('.flex-shrink-0');
                if (radioCircleOuter) radioCircleOuter.classList.replace('border-gray-400', 'border-gray-600');
                const radioCircleInner = btn.querySelector('.bg-cyan-400');
                if (radioCircleInner) {
                    radioCircleInner.classList.remove('opacity-100', 'scale-100');
                    radioCircleInner.classList.add('opacity-0', 'scale-50');
                }
            }

            btnElement.classList.add('selected', 'border-[#06b6d4]', 'bg-[rgba(8,145,178,0.15)]');
            btnElement.classList.remove('border-white/5', 'bg-white/5');
            const radioCircleOuter = btnElement.querySelector('.flex-shrink-0');
            if (radioCircleOuter) radioCircleOuter.classList.replace('border-gray-600', 'border-gray-400');
            const radioCircleInner = btnElement.querySelector('.bg-cyan-400');
            if (radioCircleInner) {
                radioCircleInner.classList.remove('opacity-0', 'scale-50');
                radioCircleInner.classList.add('opacity-100', 'scale-100');
            }

            // Save answer in memory and sessionStorage
            answers[questionId] = option.value;
            try {
                sessionStorage.setItem('nexora_quiz_answers', JSON.stringify(answers));
            } catch (e) {
                // Ignore storage errors
            }

            // Wait a moment before next step for better UX
            setTimeout(() => {
                currentStep++;
                renderStep(currentStep);
            }, 350);
        }

        // Initialize
        renderStep(0);
    </script>
</body>

</html>
